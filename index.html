<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elyra VIA - De Chat a Libro</title>
<style>
*{box-sizing:border-box}
:root{--bg:#faf7f2;--card:#fff;--brown:#2b1d1a;--accent:#c68a5a;--line:#eee6da}
body{margin:0;background:var(--bg);color:var(--brown);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.phone{border:12px solid #111;border-radius:40px;background:var(--card);padding:20px;min-height:520px;box-shadow:0 10px 30px rgba(0,0,0,.1);overflow:hidden}
.btn{width:100%;background:var(--accent);color:white;border:0;padding:14px;border-radius:30px;font-weight:700;cursor:pointer;margin-top:12px}
.btn2{background:#fff;color:var(--brown);border:1px solid var(--line)}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;outline:none}
input:focus{border-color:var(--accent)}
.tag{background:#eef2ff;padding:4px 10px;border-radius:20px;font-size:12px;display:inline-block;margin-top:6px}
.box{background:#fdf1e3;border-radius:16px;padding:20px;text-align:center;margin:14px 0}
.item{background:var(--bg);border:1px solid var(--line);padding:10px 14px;border-radius:20px;margin:8px 0;font-size:14px}
#drop{border:2px dashed var(--accent);border-radius:20px;padding:30px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1 style="text-align:center">Elyra VIA • De Chat a Libro</h1>
<div class="grid">

<div class="phone">
<h3>🔐 Acceso</h3>
<input id="email" placeholder="Tu email">
<button class="btn" onclick="login()">Continuar</button>
<p style="font-size:12px;text-align:center;margin-top:20px;color:#888">Sin compromiso • Privado y seguro</p>
</div>

<div class="phone">
<h3>📤 Importar historia</h3>
<p style="font-size:14px">Sube tu export de WhatsApp, Telegram o Instagram. Proceso 100% local.</p>
<div id="drop" onclick="document.getElementById('file').click()">
<span id="dropTxt">Toca para subir .txt o .pdf<br><small>Todo se queda en tu dispositivo</small></span>
</div>
<input type="file" id="file" accept=".txt,.pdf" hidden>
<p id="status" style="font-size:13px;text-align:center;margin-top:10px;color:#666"></p>
</div>

<div class="phone" id="resultPhone">
<h3>📖 Tu Memoria</h3>
<h2 style="margin:8px 0">Libro de Memoria</
